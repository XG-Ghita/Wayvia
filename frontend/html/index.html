<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#090613" />
    <meta name="description" content="Discover companies, explore career opportunities, and start your professional journey with WayVia." />

    <title>WayVia — Find Your Next Opportunity</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/index.css" />
</head>

<body>

    <main class="landing" aria-label="WayVia landing page">

        <!-- Static Background Image -->
        <div
            class="hero-background"
            aria-hidden="true"
        ></div>

        <!-- Cinematic Overlay -->
        <div
            class="cinematic-vignette"
            aria-hidden="true"
        ></div>

        <!-- Dark Gradient Behind Text -->
        <div
            class="left-panel"
            aria-hidden="true"
        ></div>

        <!-- Landing Page Content -->
        <section
            id="heroContent"
            class="hero-content"
            aria-label="Find your next opportunity"
        >

            <h1>
                Ready to find<br>
                your next<br>
                <span>opportunity?</span>
            </h1>

            <p class="description">
                Discover companies.<br>
                Explore possibilities.<br>
                Start your journey.
            </p>

            <button
                id="startSearch"
                class="start-button"
                type="button"
            >
                <span>Start Search</span>

                <span class="arrow" aria-hidden="true">
                    →
                </span>
            </button>

        </section>

    </main>

    <script src="../js/index.js"></script>

</body>
</html>
