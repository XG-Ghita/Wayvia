<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WayVia — Get Started</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <img
                    src="assets/images/wayvia-logo_dark.png"
                    alt="WayVia"
                    class="auth-logo"
                >

                <h1>Create your account</h1>

                <p>
                    Get started with WayVia and discover
                    opportunities that match your profile.
                </p>

            </div>


            <form id="signupForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <p
                    id="authMessage"
                    class="auth-message"
                ></p>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Get Started
                </button>

            </form>


            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <button
                    type="button"
                    id="showLogin"
                    class="text-button"
                >
                    Sign in
                </button>

            </div>

        </section>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
